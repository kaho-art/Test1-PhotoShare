async function fetchDriveMedia(folderId) {
  const q = encodeURIComponent(`'${folderId}' in parents and (mimeType contains 'image/' or mimeType contains 'video/') and trashed=false`);
  const fields = encodeURIComponent("nextPageToken,files(id,name,imageMediaMetadata,createdTime,mimeType)");
  const base = `https://www.googleapis.com/drive/v3/files?q=${q}&fields=${fields}&pageSize=1000&key=${GOOGLE_API_KEY}&orderBy=name`;
  let all=[]; let token=null;
  do {
    const url = token ? `${base}&pageToken=${token}` : base;
    const res = await fetch(url);
    if(!res.ok) throw new Error("APIエラー: "+res.status);
    const data = await res.json();
    all = [...all, ...(data.files||[])];
    token = data.nextPageToken||null;
  } while(token);
  return all.map(f=>({
    id:f.id, filename:f.name,
    mimeType:f.mimeType||"",
    isVideo:(f.mimeType||"").startsWith("video/"),
    takenAt:f.imageMediaMetadata?.time
      ? new Date(f.imageMediaMetadata.time.replace(/(\d{4}):(\d{2}):(\d{2})/,"$1-$2-$3")).toISOString()
      : f.createdTime,
  }));
}

function useMarks(albumId) {
  const [marks, setMarks] = useState({});
  useEffect(()=>{
    gasGet(`getMarks&albumId=${albumId}`).then(d=>{ if(d&&typeof d==="object"&&!Array.isArray(d)) setMarks(d); }).catch(()=>{});
  },[albumId]);
  const toggleMark = useCallback(async(photoId,markKey)=>{
    setMarks(prev=>{
      const cur=prev[photoId]||{};
      const next={...prev,[photoId]:{...cur,[markKey]:!cur[markKey]}};
      if(!next[photoId][markKey]) delete next[photoId][markKey];
      if(Object.keys(next[photoId]).length===0) delete next[photoId];
      return next;
    });
    try{ await gasPost({action:"toggleMark",albumId,photoId,markKey}); }catch(e){}
  },[albumId]);
  const hasMark=(pid,mk)=>!!(marks[pid]?.[mk]);
  const hasAnyMark=(pid)=>!!(marks[pid]&&Object.keys(marks[pid]).length>0);
  const countMark=(mk)=>Object.values(marks).filter(m=>m[mk]).length;
  return {marks,toggleMark,hasMark,hasAnyMark,countMark};
}

function useComments(albumId) {
  const [comments, setComments] = useState({});
  const loadComments = useCallback(async()=>{
    try{ const d=await gasGet(`getComments&albumId=${albumId}`); if(d&&typeof d==="object"&&!Array.isArray(d)) setComments(d); }catch(e){}
  },[albumId]);
  useEffect(()=>{ loadComments(); },[loadComments]);

  const addComment = useCallback(async(photoId, name, text)=>{
    const comment = {id:genId(), name, text, time:jstNow()};
    setComments(prev=>({...prev,[photoId]:[...(prev[photoId]||[]),comment]}));
    try{ await gasPost({action:"saveComment",albumId,photoId,comment}); }catch(e){}
  },[albumId]);

  const removeComment = useCallback(async(photoId, commentId)=>{
    setComments(prev=>({...prev,[photoId]:(prev[photoId]||[]).filter(c=>c.id!==commentId)}));
    try{ await gasPost({action:"deleteComment",albumId,commentId}); }catch(e){}
  },[albumId]);

  const hasComment = (photoId) => !!(comments[photoId]&&comments[photoId].length>0);
  const countCommented = () => Object.values(comments).filter(cs=>cs&&cs.length>0).length;
  return {comments,addComment,removeComment,hasComment,countCommented,loadComments};
}

function Chat({albumId}) {
  const [messages,setMessages]=useState([]);
  const [input,setInput]=useState("");
  const [name,setName]=useState(()=>localStorage.getItem(`pg_name_${albumId}`)||"");
  const [nameSet,setNameSet]=useState(!!localStorage.getItem(`pg_name_${albumId}`));
  const [loading,setLoading]=useState(true);
  const bottomRef=useRef(null);
  const loadMessages=async()=>{ try{ const d=await gasGet(`getMessages&albumId=${albumId}`); if(Array.isArray(d)) setMessages(d); }catch(e){} setLoading(false); };
  useEffect(()=>{ if(!nameSet){setLoading(false);return;} loadMessages(); const t=setInterval(loadMessages,5000); return()=>clearInterval(t); },[nameSet]);
  useEffect(()=>{ bottomRef.current?.scrollIntoView({behavior:"smooth"}); },[messages]);
  const saveName=()=>{ if(!name.trim())return; localStorage.setItem(`pg_name_${albumId}`,name.trim()); setNameSet(true); };
  const sendMsg=async()=>{
    if(!input.trim())return;
    const msg={id:genId(),albumId,name,text:input.trim(),time:jstNow()};
    setMessages(prev=>[...prev,msg]); setInput("");
    try{ await gasPost({action:"sendMessage",message:msg}); }catch(e){}
  };
  if(!nameSet) return (
    <div style={{padding:"24px",display:"flex",flexDirection:"column",gap:"12px",alignItems:"center",justifyContent:"center",flex:1}}>
      <p style={{color:"rgba(255,255,255,0.6)",fontSize:"13px"}}>チャットに表示される名前を入力してください</p>
      <input value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&saveName()} placeholder="例: 山田花子" style={{width:"100%",maxWidth:"280px",padding:"10px 14px",borderRadius:"10px",border:"1px solid rgba(255,255,255,0.15)",background:"rgba(255,255,255,0.07)",color:"#fff",fontSize:"14px",outline:"none",boxSizing:"border-box"}}/>
      <button className="btn" onClick={saveName} style={{padding:"10px 24px",borderRadius:"20px",background:"linear-gradient(135deg,#667eea,#764ba2)",color:"#fff",fontSize:"13px",fontWeight:"600"}}>決定</button>
    </div>
  );
  return (
    <div style={{display:"flex",flexDirection:"column",height:"100%",minHeight:"300px"}}>
      <div style={{flex:1,overflowY:"auto",padding:"16px",display:"flex",flexDirection:"column",gap:"10px"}}>
        {loading&&<div style={{textAlign:"center",padding:"20px"}}><Spinner/></div>}
        {!loading&&messages.length===0&&<div style={{textAlign:"center",color:"rgba(255,255,255,0.3)",fontSize:"13px",padding:"40px 0"}}>メッセージはまだありません</div>}
        {messages.map((msg,i)=>(
          <div key={msg.id||i}>
            <div style={{display:"flex",alignItems:"baseline",gap:"6px",justifyContent:msg.name===name?"flex-end":"flex-start"}}>
              <span style={{fontSize:"12px",fontWeight:"600",color:msg.name===name?"#a5b4fc":"#86efac"}}>{msg.name}</span>
              <span style={{fontSize:"10px",color:"rgba(255,255,255,0.3)"}}>{msg.time}</span>
            </div>
            <div style={{display:"flex",justifyContent:msg.name===name?"flex-end":"flex-start"}}>
              <div style={{background:msg.name===name?"rgba(102,126,234,0.25)":"rgba(255,255,255,0.06)",border:`1px solid ${msg.name===name?"rgba(102,126,234,0.3)":"rgba(255,255,255,0.08)"}`,borderRadius:msg.name===name?"12px 0 12px 12px":"0 12px 12px 12px",padding:"8px 12px",fontSize:"13px",color:"#fff",lineHeight:"1.5",wordBreak:"break-word",maxWidth:"80%"}}>{msg.text}</div>
            </div>
          </div>
        ))}
        <div ref={bottomRef}/>
      </div>
      <div style={{padding:"12px 16px",borderTop:"1px solid rgba(255,255,255,0.08)",display:"flex",gap:"8px",alignItems:"center"}}>
        <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&!e.shiftKey&&sendMsg()} placeholder="メッセージを入力..." style={{flex:1,padding:"10px 14px",borderRadius:"20px",border:"1px solid rgba(255,255,255,0.12)",background:"rgba(255,255,255,0.06)",color:"#fff",fontSize:"13px",outline:"none"}}/>
        <button className="btn" onClick={sendMsg} style={{padding:"10px 16px",borderRadius:"20px",background:"linear-gradient(135deg,#667eea,#764ba2)",color:"#fff",fontSize:"13px",fontWeight:"600",flexShrink:0}}>送信</button>
      </div>
      <div style={{padding:"4px 16px 8px",display:"flex",justifyContent:"space-between"}}>
        <span style={{fontSize:"10px",color:"rgba(255,255,255,0.2)"}}>名前: {name} | 5秒ごとに自動更新</span>
        <button className="btn" onClick={()=>{localStorage.removeItem(`pg_name_${albumId}`);setNameSet(false);}} style={{background:"transparent",border:"none",color:"rgba(255,255,255,0.2)",fontSize:"10px",padding:0}}>名前を変更</button>
      </div>
    </div>
  );
}

  const [photos,setPhotos]=useState([]); const [loading,setLoading]=useState(true); const [error,setError]=useState(null);
  const [selectedIdx,setSelectedIdx]=useState(null);
  const [filterMark,setFilterMark]=useState("");
  const [filterComment,setFilterComment]=useState(false);
  const [commentTarget,setCommentTarget]=useState(null); // コメント入力対象のphotoId
  const [commentName,setCommentName]=useState(()=>localStorage.getItem('pg_cname')||'');
  const [commentText,setCommentText]=useState('');
  const [thumbSize,setThumbSize]=useState(200);
  const [sortKey,setSortKey]=useState("takenAt"); const [sortDir,setSortDir]=useState("desc");
  const [showHelp,setShowHelp]=useState(false); const [showChat,setShowChat]=useState(false);
  const [checked,setChecked]=useState(new Set()); const [selectMode,setSelectMode]=useState(false);
  const [filterDate,setFilterDate]=useState("");
  const [filterType,setFilterType]=useState("all"); // all / photo / video
  const touchStartX=useRef(null);

  useEffect(()=>{ fetchDriveMedia(album.folderId).then(setPhotos).catch(e=>setError(e.message)).finally(()=>setLoading(false)); },[album.folderId]);
  const toggleCheck=(id)=>setChecked(prev=>{const next=new Set(prev);next.has(id)?next.delete(id):next.add(id);return next;});
  const clearSelect=()=>{setChecked(new Set());setSelectMode(false);};
  const availableDates=useMemo(()=>{const d=new Set(photos.map(p=>fmtDate(p.takenAt)));return[...d].sort().reverse();},[photos]);
  const displayPhotos=useMemo(()=>[...photos]
    .filter(p=>!filterMark||(marks[p.id]&&marks[p.id][filterMark]===true))
    .filter(p=>filterType==="all"||(filterType==="photo"&&!p.isVideo)||(filterType==="video"&&p.isVideo))
    .filter(p=>!filterComment||hasComment(p.id))
    .filter(p=>!filterDate||fmtDate(p.takenAt)===filterDate)
    .sort((a,b)=>{const va=a[sortKey],vb=b[sortKey];return sortDir==="asc"?(va>vb?1:-1):(va<vb?1:-1);})
  ,[photos,filterMark,filterComment,filterDate,filterType,sortKey,sortDir,marks,comments]);

  const selectAll=()=>setChecked(new Set(displayPhotos.map(p=>p.id)));
  const downloadSelected=()=>{
    const d=new Date(); const ds=String(d.getFullYear())+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
    [...checked].forEach((id,i)=>setTimeout(()=>{const ph=displayPhotos.find(p=>p.id===id);const a=document.createElement("a");a.href=driveDownload(id);a.download=ds+"_"+(ph?.filename||id+".jpg");a.target="_blank";a.click();},i*600));
  };

  const downloadByMark=(markKey)=>{
    const targets=displayPhotos.filter(p=>hasMark(p.id,markKey));
    if(targets.length===0){alert("マークした写真がありません");return;}
    if(!confirm(`${targets.length}枚をダウンロードしますか？`))return;
    const d=new Date(); const ds=String(d.getFullYear())+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
    targets.forEach((ph,i)=>setTimeout(()=>{const a=document.createElement("a");a.href=driveDownload(ph.id);a.download=ds+"_"+(ph.filename||ph.id+".jpg");a.target="_blank";a.click();},i*600));
  };

  const selected=selectedIdx!==null?displayPhotos[selectedIdx]:null;
  const goPrev=useCallback((e)=>{e&&e.stopPropagation();setSelectedIdx(i=>i>0?i-1:displayPhotos.length-1);},[displayPhotos.length]);
  const goNext=useCallback((e)=>{e&&e.stopPropagation();setSelectedIdx(i=>i<displayPhotos.length-1?i+1:0);},[displayPhotos.length]);
  useEffect(()=>{
    if(selectedIdx===null)return;
    const fn=(e)=>{if(e.key==="ArrowLeft")goPrev();else if(e.key==="ArrowRight")goNext();else if(e.key==="Escape")setSelectedIdx(null);};
    window.addEventListener("keydown",fn); return()=>window.removeEventListener("keydown",fn);
  },[selectedIdx,goPrev,goNext]);
  const onTouchStart=(e)=>{touchStartX.current=e.touches[0].clientX;};
  const onTouchEnd=(e)=>{if(touchStartX.current===null)return;const diff=touchStartX.current-e.changedTouches[0].clientX;if(Math.abs(diff)>50){diff>0?goNext():goPrev();}touchStartX.current=null;};

                <span style={{fontSize:"11px",color:left<=7?"#ff6b6b":left<=14?"#f7a928":"rgba(255,255,255,0.4)"}}>{expired?"🔒 公開終了":`⏰ 残り${left}日 (${fmtExpiry(album.expiry)})`}</span>
                <div style={{marginTop:"4px",display:"grid",gap:"2px"}}>

          <div style={{display:"flex",gap:"8px",marginTop:"10px",flexWrap:"wrap",alignItems:"center"}}>
            {MARKS.map(m=>(
              <div key={m.key} style={{display:"flex",alignItems:"center",gap:"2px"}}>
                <button className="btn" onClick={()=>setFilterMark(f=>f===m.key?"":m.key)}

                </button>
                {countMark(m.key)>0&&(
                  <button className="btn" onClick={()=>downloadByMark(m.key)} title={`${m.emoji}の写真を一括DL`}

                    ⬇️
                  </button>

              </div>

            <button className="btn" onClick={()=>setFilterComment(v=>!v)} style={{padding:"6px 12px",borderRadius:"20px",border:"none",fontSize:"12px",fontWeight:"600",background:filterComment?"rgba(96,165,250,0.8)":"rgba(255,255,255,0.08)",color:"#fff"}}>

            </button>
            <select value={filterType} onChange={e=>setFilterType(e.target.value)} style={{background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.12)",color:"#fff",padding:"6px 12px",borderRadius:"20px",fontSize:"12px",cursor:"pointer",outline:"none"}}>
              <option value="all">📷🎬 全て</option>
              <option value="photo">📷 写真のみ</option>

            <button className="btn" onClick={()=>{setSelectMode(v=>!v);if(selectMode)clearSelect();}} style={{padding:"6px 14px",borderRadius:"20px",border:"none",fontSize:"12px",fontWeight:"600",background:selectMode?"linear-gradient(135deg,#667eea,#764ba2)":"rgba(255,255,255,0.08)",color:selectMode?"#fff":"rgba(255,255,255,0.6)"}}>

            </button>
            {selectMode&&<>
              <button className="btn" onClick={selectAll} style={{padding:"6px 12px",borderRadius:"20px",border:"1px solid rgba(255,255,255,0.2)",background:"transparent",color:"#fff",fontSize:"12px"}}>全選択</button>
              {checked.size>0&&<button className="btn" onClick={downloadSelected} style={{padding:"6px 14px",borderRadius:"20px",border:"none",background:"#48c774",color:"#fff",fontSize:"12px",fontWeight:"600"}}>💾 {checked.size}枚保存</button>}
              <button className="btn" onClick={clearSelect} style={{padding:"6px 10px",borderRadius:"20px",border:"1px solid rgba(255,255,255,0.15)",background:"transparent",color:"rgba(255,255,255,0.5)",fontSize:"12px"}}>✕</button>
            </>}
            <select value={filterDate} onChange={e=>setFilterDate(e.target.value)} style={{background:filterDate?"rgba(102,126,234,0.3)":"rgba(255,255,255,0.08)",border:`1px solid ${filterDate?"rgba(102,126,234,0.6)":"rgba(255,255,255,0.12)"}`,color:"#fff",padding:"6px 12px",borderRadius:"20px",fontSize:"12px",cursor:"pointer",outline:"none"}}>

            {filterDate&&<button className="btn" onClick={()=>setFilterDate("")} style={{padding:"6px 10px",borderRadius:"20px",border:"1px solid rgba(255,255,255,0.15)",background:"transparent",color:"rgba(255,255,255,0.5)",fontSize:"12px"}}>✕</button>}
            <select value={sortKey} onChange={e=>setSortKey(e.target.value)} style={{background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.12)",color:"#fff",padding:"6px 12px",borderRadius:"20px",fontSize:"12px",cursor:"pointer",outline:"none"}}>

            </select>
            <button className="btn" onClick={()=>setSortDir(d=>d==="asc"?"desc":"asc")} style={{background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.12)",color:"#fff",padding:"6px 12px",borderRadius:"20px",fontSize:"12px"}}>{sortDir==="asc"?"↑ 古い順":"↓ 新しい順"}</button>

        </div>
      </header>

        <div style={{maxWidth:"1400px",margin:"0 auto",padding:"12px 12px 0"}}>

                <div key={photo.id} className="tc" onClick={()=>selectMode?toggleCheck(photo.id):setSelectedIdx(idx)}

                        <button key={m.key} onClick={e=>{e.stopPropagation();toggleMark(photo.id,m.key);}}

      </main>

      <div style={{position:"fixed",bottom:0,left:0,right:0,zIndex:200,background:"rgba(10,10,20,0.94)",backdropFilter:"blur(16px)",borderTop:"1px solid rgba(255,255,255,0.08)",padding:"10px 20px",paddingBottom:"calc(10px + env(safe-area-inset-bottom))",display:"flex",alignItems:"center",justifyContent:"center",gap:"12px"}}>

        <span style={{fontSize:"11px",color:"rgba(255,255,255,0.4)",width:"32px"}}>{thumbSize}</span>
      </div>

      {selected&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.96)",zIndex:500,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"16px"}}
          onClick={()=>setSelectedIdx(null)} onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>
          <button className="btn" onClick={goPrev} style={{position:"fixed",left:"12px",top:"50%",transform:"translateY(-50%)",background:"rgba(0,0,0,0.6)",border:"1px solid rgba(255,255,255,0.15)",color:"#fff",borderRadius:"50%",width:"44px",height:"44px",fontSize:"22px",display:"flex",alignItems:"center",justifyContent:"center",zIndex:10}}>&#8249;</button>
          <button className="btn" onClick={goNext} style={{position:"fixed",right:"12px",top:"50%",transform:"translateY(-50%)",background:"rgba(0,0,0,0.6)",border:"1px solid rgba(255,255,255,0.15)",color:"#fff",borderRadius:"50%",width:"44px",height:"44px",fontSize:"22px",display:"flex",alignItems:"center",justifyContent:"center",zIndex:10}}>&#8250;</button>
          <div onClick={e=>e.stopPropagation()} style={{position:"relative",maxWidth:"min(85vw,700px)",width:"100%"}}>
            {selected.isVideo?(
              <iframe src={driveVideoStream(selected.id)} style={{width:"100%",height:"56vh",borderRadius:"10px",border:"none",display:"block"}} allow="autoplay" allowFullScreen/>
            ):(
              <img src={driveView(selected.id)} alt="" style={{width:"100%",maxHeight:"58vh",objectFit:"contain",borderRadius:"10px",display:"block"}}/>

            <div style={{position:"absolute",bottom:"10px",left:"10px",background:"rgba(0,0,0,0.65)",color:"#fff",fontSize:"11px",padding:"4px 10px",borderRadius:"20px",backdropFilter:"blur(4px)"}}>
              📅 {fmt(selected.takenAt)} ({selectedIdx+1}/{displayPhotos.length})
            </div>
            <div style={{position:"absolute",top:"10px",right:"10px",display:"flex",gap:"4px"}}>
              {MARKS.map(m=>(
                <button key={m.key} onClick={e=>{e.stopPropagation();toggleMark(selected.id,m.key);}}
                  style={{background:hasMark(selected.id,m.key)?m.color:"rgba(0,0,0,0.6)",border:"none",borderRadius:m.key==="raw"?"8px":"50%",width:m.key==="raw"?"auto":"36px",height:"36px",padding:m.key==="raw"?"0 8px":"0",fontSize:m.key==="raw"?"11px":"16px",fontWeight:m.key==="raw"?"700":"normal",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",backdropFilter:"blur(4px)",color:"#fff"}}>

                </button>
              ))}
            </div>
          </div>
          <div onClick={e=>e.stopPropagation()} style={{display:"flex",flexWrap:"wrap",gap:"8px",marginTop:"14px",justifyContent:"center"}}>
            {[
              {label:"💾 元画像サイズで保存",fn:()=>{const d=new Date();const ds=String(d.getFullYear())+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");const a=document.createElement("a");a.href=driveDownload(selected.id);a.download=ds+"_"+(selected.filename||selected.id+".jpg");a.target="_blank";a.click();},bg:"#667eea"},
              {label:"📲 LINEで共有",fn:()=>window.open(`https://social-plugins.line.me/lineit/share?url=${encodeURIComponent(driveView(selected.id))}`,"_blank"),bg:"#06c755"},
              ...(hasLine?[{label:"💬 LINEで相談",fn:()=>window.open(album.lineUrl,"_blank"),bg:"#00b900"}]:[]),
              {label:"✉️ メールで共有",fn:()=>window.open(`mailto:?subject=写真をお届けします&body=${encodeURIComponent(driveView(selected.id))}`,"_blank"),bg:"#f7a928"},
            ].map(({label,fn,bg})=>(
              <button key={label} className="btn" onClick={fn} style={{padding:"9px 14px",borderRadius:"30px",border:"none",background:bg,color:"#fff",fontSize:"12px",fontWeight:"600"}}>{label}</button>
            ))}
          </div>
          <button className="btn" onClick={()=>setSelectedIdx(null)} style={{marginTop:"12px",background:"transparent",border:"1px solid rgba(255,255,255,0.25)",color:"rgba(255,255,255,0.5)",padding:"7px 24px",borderRadius:"20px",fontSize:"13px"}}>閉じる</button>

          {/* コメントセクション */}
          <div onClick={e=>e.stopPropagation()} style={{width:"100%",maxWidth:"min(85vw,700px)",marginTop:"12px",background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:"14px",padding:"14px",boxSizing:"border-box"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"10px"}}>
              <span style={{fontSize:"13px",fontWeight:"600",color:"#fff"}}>📝 コメント</span>
              <button className="btn" onClick={()=>setCommentTarget(commentTarget===selected?.id?null:selected?.id)} style={{background:"rgba(96,165,250,0.2)",border:"1px solid rgba(96,165,250,0.4)",color:"#93c5fd",padding:"4px 12px",borderRadius:"14px",fontSize:"11px"}}>
                {commentTarget===selected?.id?"キャンセル":"+ 追加"}
              </button>
            </div>
            {(comments[selected?.id]||[]).length===0&&commentTarget!==selected?.id&&(
              <p style={{color:"rgba(255,255,255,0.3)",fontSize:"12px",textAlign:"center",padding:"8px 0"}}>まだコメントがありません</p>
            )}
            {(comments[selected?.id]||[]).map(c=>(
              <div key={c.id} style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",padding:"8px 10px",background:"rgba(255,255,255,0.04)",borderRadius:"10px",marginBottom:"6px"}}>
                <div>
                  <span style={{fontSize:"11px",fontWeight:"600",color:"#a5b4fc",marginRight:"8px"}}>{c.name}</span>
                  <span style={{fontSize:"12px",color:"#fff"}}>{c.text}</span>
                  <div style={{fontSize:"10px",color:"rgba(255,255,255,0.3)",marginTop:"2px"}}>{c.time}</div>
                </div>
                <button className="btn" onClick={()=>removeComment(selected?.id,c.id)} style={{background:"transparent",border:"none",color:"rgba(255,255,255,0.3)",fontSize:"14px",padding:"0 4px",flexShrink:0}}>✕</button>
              </div>
            ))}
            {commentTarget===selected?.id&&(
              <div style={{marginTop:"8px",display:"grid",gap:"6px"}}>
                <input value={commentName} onChange={e=>{setCommentName(e.target.value);localStorage.setItem('pg_cname',e.target.value);}} placeholder="名前" style={{padding:"8px 10px",borderRadius:"8px",border:"1px solid rgba(255,255,255,0.12)",background:"rgba(255,255,255,0.06)",color:"#fff",fontSize:"12px",outline:"none"}}/>
                <div style={{display:"flex",gap:"6px"}}>
                  <input value={commentText} onChange={e=>setCommentText(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&commentName.trim()&&commentText.trim()){addComment(selected?.id,commentName.trim(),commentText.trim());setCommentText('');setCommentTarget(null);}}} placeholder="コメントを入力（例: 物販１、フォトブ）" style={{flex:1,padding:"8px 10px",borderRadius:"8px",border:"1px solid rgba(255,255,255,0.12)",background:"rgba(255,255,255,0.06)",color:"#fff",fontSize:"12px",outline:"none"}}/>
                  <button className="btn" onClick={()=>{if(commentName.trim()&&commentText.trim()){addComment(selected?.id,commentName.trim(),commentText.trim());setCommentText('');setCommentTarget(null);}}} style={{padding:"8px 14px",borderRadius:"8px",background:"linear-gradient(135deg,#667eea,#764ba2)",color:"#fff",fontSize:"12px",fontWeight:"600",flexShrink:0}}>送信</button>
                </div>
              </div>
            )}
          </div>
        </div>
      )}

      {showHelp&&(
        <div onClick={()=>setShowHelp(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.8)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:"20px"}}>
          <div onClick={e=>e.stopPropagation()} style={{background:"#1a1a2e",border:"1px solid rgba(255,255,255,0.1)",borderRadius:"20px",padding:"28px 24px",maxWidth:"440px",width:"100%",maxHeight:"85vh",overflowY:"auto"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"20px"}}>
              <h2 style={{color:"#fff",margin:0,fontSize:"17px"}}>📖 使い方ガイド</h2>
              <button className="btn" onClick={()=>setShowHelp(false)} style={{background:"rgba(255,255,255,0.1)",border:"none",color:"#fff",borderRadius:"50%",width:"32px",height:"32px",fontSize:"18px"}}>✕</button>
            </div>
            {[
              ["❤️⭐👑","マーク機能","写真右上の3つのボタンでマーク。上部ボタンで絞り込みできます。3つ同時もOK！"],
              ["◀▶","写真のナビ","拡大表示中に左右矢印で前後へ。スマホはスワイプでもOK！"],
              ["📅","日付フィルター","「📅 全日程」で日付を選ぶとその日だけ表示。"],
              ["💬","チャット/LINE","カメラマンへの連絡はチャットまたはLINEから。"],
              ["☑️","複数選択保存","「複数選択」でチェック。「全選択」も可。まとめて保存。"],
              ["💾","保存","拡大表示中に「元画像サイズで保存」で保存。"],
              ["🖼","サイズ調整","画面下のスライダーでサムネイルの大きさを変更。"],
              ["📱","ホーム追加","iPhone: Safariで開いて共有→「ホーム画面に追加」\nAndroid: Chromeでメニュー→「ホーム画面に追加」"],
            ].map(([icon,title,desc])=>(
              <div key={title} style={{display:"flex",gap:"14px",marginBottom:"16px",padding:"14px",background:"rgba(255,255,255,0.04)",borderRadius:"12px"}}>
                <span style={{fontSize:"20px",flexShrink:0}}>{icon}</span>
                <div><div style={{color:"#fff",fontWeight:"600",fontSize:"13px",marginBottom:"4px"}}>{title}</div><div style={{color:"rgba(255,255,255,0.5)",fontSize:"12px",lineHeight:"1.6",whiteSpace:"pre-line"}}>{desc}</div></div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function App() {
  const params=new URLSearchParams(location.search);
  const albumId=params.get("a"); const isAdmin=params.get("admin")==="1";
  const [adminLoggedIn,setAdminLoggedIn]=useState(()=>sessionStorage.getItem("pg_admin")==="1");
  const [clientAuth,setClientAuth]=useState(()=>sessionStorage.getItem(`pg_client_${albumId}`)==="1");
  const [album,setAlbum]=useState(null); const [albumLoading,setAlbumLoading]=useState(!!albumId); const [albumNotFound,setAlbumNotFound]=useState(false);
  useEffect(()=>{
    if(!albumId)return;
    gasGet("getAlbums").then(data=>{ const found=(Array.isArray(data)?data:[]).find(a=>a.id===albumId); if(found)setAlbum(found);else setAlbumNotFound(true); }).catch(()=>setAlbumNotFound(true)).finally(()=>setAlbumLoading(false));
  },[albumId]);
  if(isAdmin){
    if(!adminLoggedIn)return<AdminLogin onLogin={()=>{sessionStorage.setItem("pg_admin","1");setAdminLoggedIn(true);}}/>;
    return<AdminPanel onLogout={()=>{sessionStorage.removeItem("pg_admin");setAdminLoggedIn(false);}}/>;
  }
  if(albumId){
    if(albumLoading)return<div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#0f0f1a"}}><Spinner/></div>;
    if(albumNotFound||!album)return<div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#0f0f1a",color:"#fff",flexDirection:"column",gap:"12px"}}><div style={{fontSize:"48px"}}>🔍</div><p style={{color:"rgba(255,255,255,0.5)"}}>アルバムが見つかりません</p></div>;
    if(!clientAuth)return<ClientLogin album={album} onLogin={()=>{sessionStorage.setItem(`pg_client_${albumId}`,"1");setClientAuth(true);}}/>;
    return<Gallery album={album}/>;
  }
  return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"linear-gradient(135deg,#0f0f1a,#1a1a2e)",color:"#fff",flexDirection:"column",gap:"16px",padding:"20px",textAlign:"center"}}>
      <div style={{fontSize:"56px"}}>📷</div>
      <h1 style={{fontSize:"22px",fontWeight:"300",letterSpacing:"0.2em"}}>Kaho's Photo</h1>
      <p style={{color:"rgba(255,255,255,0.4)",fontSize:"13px"}}>お客さまから届いたURLでアクセスしてください</p>
      <a href="?admin=1" style={{marginTop:"24px",color:"rgba(255,255,255,0.2)",fontSize:"11px",textDecoration:"none"}}>管理者の方はこちら</a>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>

  if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
